name: Compilar APK de YTD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Redirigir código
      uses: actions/checkout@v4

    - name: Configurar Cache de Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        # Cambiamos la clave a 'v2' para forzar a GitHub a borrar la caché vieja y corrupta
        key: ${{ runner.os }}-buildozer-v2-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildozer-v2-

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev libglib2.0-dev libffi-dev libssl-dev
        sudo apt-get install -y build-essential ccache git zlib1g-dev libncurses5-dev libgdbm-dev libncursesw5-dev libreadline-dev uuid-dev libgdbm-compat-dev
        sudo apt-get install -y openjdk-17-jdk-headless unzip zip
        pip3 install --user --upgrade buildozer cython virtualenv

    - name: Compilar APK con Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        
        # 1. Crear el directorio de licencias del SDK de Android antes de compilar
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        
        # 2. Inyectar los hashes de aprobación oficiales de Google (incluye la nueva build-tools 37)
        echo -e "\n89346db307477b1b6f88c27a47423e291c81e53d\n24333f1a50b1b1c67414e811d782547ef223d721\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n84934015526d973048dd7765245a4475317748ca" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
        
        # 3. Forzar la aceptación interactiva en la ejecución de buildozer
        yes | buildozer android debug
        
    - name: Subir APK terminada
      uses: actions/upload-artifact@v4
      with:
        name: YTD-APK-Debug
        path: bin/*.apk
        
